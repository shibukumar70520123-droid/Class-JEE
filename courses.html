<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class JEE - Courses</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    #status {
      text-align: center;
      padding: 15px;
      color: #555;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .course {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .course h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .course p {
      color: #555;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #e5e7eb;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>Class JEE</h1>
  <p>Classes • JEE Main • JEE Advanced</p>
</header>

<div class="container">

  <div id="status">Courses load हो रहे हैं...</div>

  <div id="courses" class="courses"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwmPNOJkyUYHZcb-YQSh1MTJHNKXHVz8C20TdCJxHPDiS80cioyBV8c0BUSZDlSMUKQ/exec";

async function loadCourses() {

  const status = document.getElementById("status");
  const coursesBox = document.getElementById("courses");

  try {

    const response = await fetch(API_URL);

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "Data नहीं मिला");
    }

    const rows = data.rows;

    coursesBox.innerHTML = "";

    // Row 1 title है, Row 2 headings हैं
    // इसलिए actual courses Row 3 से शुरू होंगे

    const courseRows = rows.slice(2);

    const activeCourses = courseRows.filter(row => {

      return String(row[6]).toLowerCase() !== "false";

    });

    if (activeCourses.length === 0) {

      coursesBox.innerHTML = `
        <div class="empty">
          <h2>अभी कोई Course उपलब्ध नहीं है</h2>
          <p>Admin Panel से Course add करें।</p>
        </div>
      `;

      status.style.display = "none";
      return;
    }

    activeCourses.forEach(row => {

      const id = row[0] || "";
      const name = row[1] || "Course";
      const category = row[2] || "";
      const description = row[3] || "";
      const type = row[4] || "";
      const price = row[5] || "";

      let priceText = "Free";

      if (
        price !== "" &&
        price !== "0" &&
        price !== 0
      ) {
        priceText = "₹" + price;
      }

      coursesBox.innerHTML += `

        <div class="course">

          <span class="badge">
            ${category}
          </span>

          <h2>${name}</h2>

          <p>
            ${description}
          </p>

          <div class="price">
            ${priceText}
          </div>

          <button
            class="btn"
            onclick="openCourse('${id}')">
            View Course
          </button>

        </div>

      `;
    });

    status.style.display = "none";

  } catch (error) {

    status.innerHTML =
      "❌ Courses load नहीं हो पाए।";

    console.error(error);

  }

}

function openCourse(id) {

  alert(
    "Course ID: " + id +
    "\nCourse page बाद में यहाँ खुलेगा।"
  );

}

loadCourses();

</script>

</body>
</html>
